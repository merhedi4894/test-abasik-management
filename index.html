function showToast(m,t='success'){m=String(m).replace(/(https?:\/\/[^\s]+)/g,'');const e=document.createElement('div');e.className=`toast ${t}`;e.textContent=m;document.getElementById('toastContainer').appendChild(e);setTimeout(()=>e.remove(),3000)}
function showConfirm(m,y){const o=document.getElementById('customAlertOverlay');o.innerHTML=`<div class="modal" style="max-width:400px;border-radius:20px;padding:24px;margin:auto"><h3 style="margin-bottom:16px;font-size:18px">নিশ্চিতকরণ</h3><p style="margin-bottom:16px;font-size:14px">${m}</p><div class="flex gap-8"><button class="btn btn-primary" style="flex:1" id="cYes">নিশ্চিত</button><button class="btn btn-outline" style="flex:1" id="cNo">বাতিল</button></div></div>`;o.classList.add('active');o.style.display='flex';document.getElementById('cYes').onclick=()=>{o.classList.remove('active');o.style.display='none';y()};document.getElementById('cNo').onclick=()=>{o.classList.remove('active');o.style.display='none'}}
function openModal(t,c,l=false,r=false){const m=document.getElementById('modalContent');if(!r&&m.innerHTML.trim()!==''){modalStack.push(m.innerHTML)}if(r)modalStack=[];const el=document.getElementById('modal');el.className=l?'modal large':'modal';m.innerHTML=`<div class="modal-header"><h3>${t}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>${c}`;document.getElementById('modalOverlay').classList.add('active');document.getElementById('modalOverlay').style.display='flex';el.scrollTop=0}
function closeModal(){if(modalStack.length>0){document.getElementById('modalContent').innerHTML=modalStack.pop();document.getElementById('modal').scrollTop=0}else{forceCloseModal()}}
function forceCloseModal(){modalStack=[];const m=document.getElementById('modalOverlay');m.classList.remove('active');m.style.display='none';document.getElementById('modalContent').innerHTML=''}
function showLoginView(){document.getElementById('loginView').style.display='block'}
function handleLogin(){const i=document.getElementById('loginIdentifier').value.trim(),p=document.getElementById('loginPassword').value.trim();if(!i||!p){showToast('সব ফিল্ড পূরণ করুন','error');return}firebase.auth().signInWithEmailAndPassword(i.includes('@')?i:i,p).catch(e=>showToast(e.message,'error'))}
function handleLogout(){firebase.auth().signOut()}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('active')}

const Store={
    async getBuildings(){const s=await db.collection('buildings').get();return s.docs.map(d=>({id:d.id,...d.data()}))},
    async saveBuilding(b){if(b.id){await db.collection('buildings').doc(b.id).set(b,{merge:true});return b}const r=await db.collection('buildings').add({name:b.name,floorCount:b.floorCount||0});return{id:r.id,name:b.name,floorCount:b.floorCount||0}},
    async deleteBuilding(id){await db.collection('buildings').doc(id).delete();const r=await db.collection('rooms').where('buildingId','==',id).get();const b=db.batch();r.docs.forEach(d=>b.delete(d.ref));await b.commit()},
    async getRooms(){const s=await db.collection('rooms').get();return s.docs.map(d=>({id:d.id,...d.data()}))},
    async saveRoom(r){if(r.id){await db.collection('rooms').doc(r.id).set(r,{merge:true});return r}const ref=await db.collection('rooms').add(r);return{id:ref.id,...r}},
    async deleteRoom(id){await db.collection('rooms').doc(id).delete()},
    async getTemplates(bId){const d=await db.collection('materialTemplates').doc(bId).get();return d.exists?(d.data().items||[]):[]},
    async saveTemplates(bId,i){await db.collection('materialTemplates').doc(bId).set({items:i})}
};

async function fetchFromTurso(){
    document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('active');
    const sM=document.getElementById('syncModal'),sP=document.getElementById('syncProgressBar'),sT=document.getElementById('syncProgressText');
    sM.style.display='block';sP.style.width='0%';sT.innerText='0% - ডাটা ফেচ করা হচ্ছে...';
    try{
        const ex=async(sql)=>{const r=await fetch(`${TURSO_URL}/v2/pipeline`,{method:'POST',headers:{'Authorization':`Bearer ${TURSO_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{type:"execute",stmt:{sql}},{type:"close"}]})});const d=await r.json();if(!r.ok)throw new Error(d.message);if(!d.results||!d.results[0]||!d.results[0].response||!d.results[0].response.result)return[];const res=d.results[0].response.result;return(res.rows||[]).map(row=>{let o={};res.cols.forEach((c,i)=>{let v=row[i];o[c.name]=(typeof v==='object'&&v!==null&&'value'in v)?v.value:v});return o})};
        sP.style.width='10%';sT.innerText='10% - বিল্ডিং আসছে...';const bD=await ex('SELECT * FROM "Building"');
        sP.style.width='20%';sT.innerText='20% - রুম আসছে...';const rD=await ex('SELECT * FROM "Room"');
        sP.style.width='30%';sT.innerText='30% - ভাড়াটে আসছে...';const tD=await ex('SELECT * FROM "Tenant"');const fD=await ex('SELECT * FROM "Floor"');
        sP.style.width='40%';sT.innerText='40% - মালামাল আসছে...';const iD=await ex('SELECT * FROM "Inventory"');const tpD=await ex('SELECT * FROM "BelongingTemplate"');const repD=await ex('SELECT * FROM "TroubleReport"');
        sP.style.width='50%';sT.innerText='50% - চেক করা হচ্ছে...';
        const fbB=await Store.getBuildings(),fbR=await Store.getRooms();
        if(bD.length===fbB.length&&rD.length===fbR.length){showToast("নতুন কোন ডাটা Turso ডাটাবেজে পাওয়া যাইনি","info");sM.style.display='none';return}
        let cnt=0;const tot=bD.length+rD.length+repD.length;
        for(const b of bD){await db.collection('buildings').doc(b.id).set({name:b.name,floorCount:b.totalFloors||0},{merge:true});const tp=tpD.filter(t=>t.buildingId===b.id);if(tp.length>0)await db.collection('materialTemplates').doc(b.id).set({items:tp.map(t=>({id:t.id,name:t.itemName,quantity:t.quantity}))});cnt++;const p=50+Math.round((cnt/tot)*50);sP.style.width=p+'%';sT.innerText=p+'% - বিল্ডিং সেভ হচ্ছে...'}
        for(const r of rD){const fl=fD.find(f=>f.id===r.floorId);if(!fl)continue;const aT=tD.filter(t=>t.roomId===r.id&&t.isActive),pT=tD.filter(t=>t.roomId===r.id&&!t.isActive),inv=iD.filter(i=>i.roomId===r.id);
            await db.collection('rooms').doc(r.id).set({buildingId:fl.buildingId,floor:String(fl.floorNumber),number:r.roomNumber,tenants:aT.map(t=>({id:t.id,name:t.name,designation:t.designation||'',phone:t.phone||'',startDate:t.startDate?new Date(t.startDate).toISOString().split('T')[0]:'',type:'bachelor',familyInfo:''})),previousTenants:pT.map(t=>({id:t.id,name:t.name,designation:t.designation||'',phone:t.phone||'',startDate:t.startDate?new Date(t.startDate).toISOString().split('T')[0]:'',endDate:t.endDate?new Date(t.endDate).toISOString().split('T')[0]:''})),items:inv.map(i=>{const h=[];if(i.note||i.lastRepairDate||i.lastReplaceDate)h.push({type:i.lastReplaceDate?'Replace':'Repair',date:i.lastReplaceDate?new Date(i.lastReplaceDate).toISOString().split('T')[0]:(i.lastRepairDate?new Date(i.lastRepairDate).toISOString().split('T')[0]:(i.addedDate?new Date(i.addedDate).toISOString().split('T')[0]:'')),note:i.note||'',condition:i.condition||'ভাল',quantity:i.quantity||1});return{id:i.id,name:i.itemName,quantity:i.quantity,condition:i.condition||'ভাল',lastRepairDate:i.lastRepairDate?new Date(i.lastRepairDate).toISOString().split('T')[0]:null,lastReplaceDate:i.lastReplaceDate?new Date(i.lastReplaceDate).toISOString().split('T')[0]:null,history:h}}),guests:[],occupants:[]},{merge:true});cnt++;const p=50+Math.round((cnt/tot)*50);sP.style.width=p+'%';sT.innerText=p+'% - রুম সেভ হচ্ছে...'}
        for(const rep of repD){const rm=rD.find(r=>r.id===rep.roomId),fl=rm?fD.find(f=>f.id===rm.floorId):null,bd=fl?bD.find(b=>b.id===fl.buildingId):null;await db.collection('reports').doc(rep.id).set({building:bd?bd.name:'Unknown',floor:fl?String(fl.floorNumber):'-',room:rm?rm.roomNumber:'-',description:rep.description,reporter:rep.reportedBy,status:rep.status==='সমাধান হয়েছে'?'resolved':'pending',createdAt:{seconds:rep.reportedAt?new Date(rep.reportedAt).getTime()/1000:Date.now()/1000}},{merge:true});cnt++;const p=50+Math.round((cnt/tot)*50);sP.style.width=p+'%';sT.innerText=p+'% - রিপোর্ট সেভ হচ্ছে...'}
        state.buildings=await Store.getBuildings();state.rooms=await Store.getRooms();renderPage();
        sP.style.width='100%';sT.innerText='100% - সম্পূর্ণ!';setTimeout(()=>{sM.style.display='none';showToast(`সফল! ${cnt} টি ডাটা সেভ হয়েছে।`,"success")},1000);
    }catch(e){console.error(e);showToast("ডাটা আনতে সমস্যা হয়েছে।","error");sM.style.display='none'}
}

function escapeHtml(s){return s?String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])):''}
function formatDate(d){if(!d)return'-';const dt=new Date(d);return isNaN(dt)?d:dt.toLocaleDateString('bn-BD')}
function getConditionBadge(c){return`<span class="badge badge-good">${c||'-'}</span>`}
function renderPage(){const c=document.getElementById('pageContent');if(state.buildings.length===0){c.innerHTML=`<div class="card"><div class="empty-state"><p>কোন বিল্ডিং নেই।</p></div></div>`;return}let oH=state.expandedBuilding?`<div class="expanded-overlay" onclick="toggleExpand('${state.expandedBuilding}')"></div>`:'';c.innerHTML=oH+`<div class="building-grid">${state.buildings.map(b=>{const bR=state.rooms.filter(r=>r.buildingId===b.id),occ=bR.filter(r=>(r.tenants&&r.tenants.length>0)||r.tenant).length,isExp=state.expandedBuilding===b.id;let body='';if(isExp){for(let f=1;f<=(b.floorCount||1);f++){const fR=bR.filter(r=>r.floor==String(f));body+=`<div style="margin-bottom:16px"><div class="flex-between mb-16"><strong>তলা: ${f}</strong><button class="btn btn-primary btn-sm" onclick="event.stopPropagation();showAddRoomModal('${b.id}','${f}')">➕ রুম</button></div><div class="room-grid">${fR.length>0?fR.map(r=>{const o=!!(r.tenants&&r.tenants.length>0)||!!r.tenant;return`<div class="room-box-mini ${o?'occupied':''}" onclick="event.stopPropagation();showRoomDetail('${r.id}')"><div class="r-num">${escapeHtml(r.number)}</div><div class="r-icon">${o?'👤':''}</div></div>`}).join(''):`<p class="text-sm text-light">কোন রুম নেই।</p>`}</div></div>`}}return`<div class="building-card ${isExp?'expanded':''}"><div class="building-card-header" onclick="toggleExpand('${b.id}')"><div class="b-actions" onclick="event.stopPropagation()"><button class="b-icon" onclick="editBuilding('${b.id}')">${editIcon}</button><button class="b-icon danger" onclick="deleteBuilding('${b.id}')">${delIcon}</button></div><div><h3>🏢 ${escapeHtml(b.name)}</h3><div class="b-stats">তলা: ${b.floorCount||0} | রুম: ${bR.length} | ভাড়াটে: ${occ}</div></div></div><div class="building-card-body" onclick="if(event.target===this)toggleExpand('${b.id}')">${body}</div></div>`}).join('')}</div>`}
function toggleExpand(id){state.expandedBuilding=state.expandedBuilding===id?null:id;renderPage()}
function showAddBuildingModal(){openModal('নতুন বিল্ডিং',`<div class="form-group"><label>বিল্ডিং এর নাম</label><input type="text" id="buildingName"></div><div class="form-group"><label>কয়টা তলা?</label><input type="number" id="floorCount" value="1" min="1"></div><button class="btn btn-primary" style="width:100%" onclick="saveBuildingModal()">সেভ করুন</button>`)}
async function saveBuildingModal(){const n=document.getElementById('buildingName').value.trim(),f=parseInt(document.getElementById('floorCount').value)||0;if(!n){showToast('নাম লিখুন','error');return}const tId='t_'+Date.now();state.buildings.push({id:tId,name:n,floorCount:f});closeModal();renderPage();try{const s=await Store.saveBuilding({name:n,floorCount:f});const i=state.buildings.findIndex(b=>b.id===tId);if(i>-1)state.buildings[i]=s;showToast('সেভ হয়েছে')}catch(e){showToast('সমস্যা','error')}}
function showRoomDetail(rId){openModal('রুম ডিটেইলস',`<div id="roomTabContent"></div>`,true);setTimeout(()=>{const c=document.getElementById('roomTabContent');c.innerHTML=`<div class="card"><h4>মালামাল তালিকা</h4><div class="table-wrapper"><table class="material-table"><thead><tr><th>নাম</th><th>পরি.</th><th>অবস্থা</th><th>রিপে./রিপ্লে.</th></tr></thead><tbody>${(state.rooms.find(r=>r.id===rId)?.items||[]).map(i=>`<tr><td>${escapeHtml(i.name)}</td><td>${i.quantity}</td><td>${getConditionBadge(i.condition)}</td><td>${i.lastRepairDate?formatDate(i.lastRepairDate):'-'}</td></tr>`).join('')}</tbody></table></div></div>`},0)}
function handleGlobalSearch(v){const d=document.getElementById('searchDropdown');if(!v.trim()){d.style.display='none';return}const res=state.rooms.filter(r=>r.number.toLowerCase().includes(v.toLowerCase())||r.tenants?.some(t=>t.name.toLowerCase().includes(v.toLowerCase())));d.innerHTML=res.length===0?'<div class="search-item text-light">কোন ফলাফল নেই</div>':res.map(r=>`<div class="search-item" onclick="showRoomDetail('${r.id}');document.getElementById('searchDropdown').style.display='none'"><strong>${escapeHtml(r.tenants?.[0]?.name||'খালি')}</strong><br><span class="text-sm">রুম: ${escapeHtml(r.number)}</span></div>`).join('');d.style.display='block'}
document.addEventListener('click',e=>{if(!e.target.closest('.search-box'))document.getElementById('searchDropdown').style.display='none'});
function initApp(){if(typeof firebase==='undefined'||!firebase.auth){document.getElementById('authContainer').style.display='flex';showLoginView();return}firebase.auth().onAuthStateChanged(async u=>{if(u){currentUser={id:u.uid,email:u.email};document.getElementById('authContainer').style.display='none';document.getElementById('appContainer').style.display='block';state.buildings=await Store.getBuildings();state.rooms=await Store.getRooms();renderPage()}else{currentUser=null;document.getElementById('appContainer').style.display='none';document.getElementById('authContainer').style.display='flex';showLoginView()}document.getElementById('loader').style.display='none'})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();
</script>
